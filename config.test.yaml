# Configuración de validación: grilla de 500 m, un año climático y salidas
# separadas. Usa ARCO, igual que la configuración principal.

region:
  name: "Santa Fe"
  admin_source:
    provider: "IGN"
    shapefile_zip_url: "http://www.ign.gob.ar/descargas/geodatos/SHAPES/ign_provincia.zip"
    shapefile_member: "Provincia/ign_provincia.shp"
    name_field: "NAM"
    code_field: "IN1"
    code_value: "82"
    native_crs: "EPSG:4326"

grid:
  resolution_km: 0.5

park:
  pv_power_density_mw_per_km2: 31.3
  max_connection_capacity_mw: 80

urban_exclusion:
  buffer_km: 0.0
  fill_holes: true

climate:
  dataset: "reanalysis-era5-land-timeseries"
  variable: "surface_solar_radiation_downwards"
  start_year: 2024
  end_year: 2024
  months: [1, 4, 7, 10]

infrastructure:
  urban_areas:
    provider: "INDEC"
    wfs_url: "https://geonode.indec.gob.ar/geoserver/geonode/wfs"
    layer_name: "geonode:localidades_censales"
    reference_year: 2022
    page_size: 500
  power_lines:
    resource_id: "3d5eda86-6822-5c39-b366-f89360b0363a"
  transformers:
    source_url: "http://datos.energia.gob.ar/dataset/5ae5fbf9-5ab3-407b-a047-625bf27835aa/resource/cedb62c4-4a4c-4124-bdc9-48f611a59862/download/transporte-elctrico-at-estaciones-transformadoras.csv"
    native_crs: "EPSG:4326"

fitness:
  weight_solar: 0.40
  weight_grid_distance: 0.10
  weight_transformer_distance: 0.25
  weight_installed_power: 0.25

genetic_algorithm:
  population_size: 50
  generations: 100
  crossover_probability: 0.75
  mutation_probability: 0.20
  elitism: 2
  tournament_size: 3
  random_seed: 42
  territory_size_km: 50
  duplicate_attempts: 8
  mutation_attempts: 4
  territorial_separation_km: 0
  archive_per_territory: 10

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  arco_cache: "data/cache/arco_blocks"
  database: "data/processed/parque_solar_spatial_test.sqlite"
  results: "results/spatial_test"
  logs: "logs"
