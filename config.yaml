# Configuración para el MVP de ubicación de parques solares.
#
# Nada específico de la región está hardcodeado en el código fuente: cambiando
# `region` (y, si una futura provincia necesita una fuente administrativa
# distinta, el bloque `region.admin_source`) alcanza para correr el mismo
# pipeline sobre otra provincia argentina. Ver en README.md "Cambiar de
# provincia" el checklist completo de qué cambia y qué no.

region:
  name: "Santa Fe"
  # Fuente oficial del límite administrativo: dataset "Unidades Territoriales"
  # del Instituto Geográfico Nacional (IGN), publicado en datos.gob.ar.
  # https://datos.gob.ar/dataset/unidades-territoriales
  admin_source:
    provider: "IGN"
    shapefile_zip_url: "http://www.ign.gob.ar/descargas/geodatos/SHAPES/ign_provincia.zip"
    shapefile_member: "Provincia/ign_provincia.shp"
    name_field: "NAM"      # nombre corto de la provincia, ej. "Santa Fe"
    code_field: "IN1"      # código de provincia INDEC/GeoRef, ej. "82" para Santa Fe
    code_value: "82"
    native_crs: "EPSG:4326"  # CRS del propio shapefile del IGN (confirmado desde su .prj)

grid:
  # Tamaño de celda de la grilla de análisis. Es una unidad de discretización
  # espacial para el problema de optimización — NO la resolución de ninguna
  # fuente de datos en particular.
  resolution_km: 9

park:
  # Superficie nominal de un único parque solar candidato.
  # 2 ha = 20.000 m^2 = 0.02 km^2. Se guarda solo para trazabilidad: el MVP
  # todavía NO verifica que existan 20.000 m^2 contiguos de terreno utilizable
  # dentro de una celda candidata (todavía no hay capa de cobertura de suelo —
  # ver README).
  area_hectares: 2

urban_exclusion:
  # La fuente de "localidades" de BAHRA (ver infrastructure.urban_areas más
  # abajo) provee PUNTOS, no polígonos. Para aproximar una huella urbana a
  # fines de exclusión, cada punto de localidad se bufferiza con este radio
  # (en un CRS proyectado, métrico). Esta es una aproximación de MVP
  # documentada, no una capa catastral real de límites urbanos.
  buffer_km: 3.0
  # BAHRA mezcla centros poblados reales con estructuras edificadas aisladas
  # (edificios sueltos, escuelas rurales, etc.) bajo distintos valores de
  # `tipo`. Distribución observada en Santa Fe: LOCALIDAD=386,
  # SITIO EDIFICADO=473, ENTIDAD=6. Bufferizar TODOS con buffer_km excluye
  # ~48% de toda la provincia (dominado por los puntos aislados de
  # "SITIO EDIFICADO", que no son zonas urbanas). Solo estos tipos se tratan
  # como "urbanos" para el criterio de exclusión; el resto de la capa BAHRA
  # ingerida igual se guarda completa para trazabilidad.
  include_types: ["LOCALIDAD"]

climate:
  # Dataset del Copernicus Climate Data Store. DEBE seguir siendo el dataset
  # Time-Series / ARCO según los requisitos del proyecto — no sustituir por
  # ERA5 simple, ERA5-Land mensual, ni el archivo horario bulk de ERA5-Land.
  dataset: "reanalysis-era5-land-timeseries"
  variable: "surface_solar_radiation_downwards"
  start_year: 1970
  end_year: latest  # último mes representativo completo con un mes de margen de publicación
  months: [1, 4, 7, 10]   # enero (verano), abril (otoño), julio (invierno), octubre (primavera)
  # El schema formal de solicitud del dataset expone un bounding box `area`
  # (no un par lat/lon suelto) como selector geográfico. Para pedir un único
  # punto se envía un bounding box centrado en él. Un epsilon demasiado
  # chico (se probó 0.001°) falla con "MultiAdaptorNoDataError: No data
  # found" contra la API real, porque no hay garantía de que la grilla
  # ARCO esté alineada exactamente en múltiplos de 0.1° respecto al punto
  # pedido — el desfase real de fase de la grilla no está documentado.
  # 0.06° da un bounding box de 0.12° de lado, más ancho que el espaciado
  # nativo de 0.1°, así que contiene al menos un punto de grilla sin
  # importar el desfase. Si el área devuelve más de un punto, el cliente
  # se queda con el más cercano a la coordenada pedida (ver
  # src/api/copernicus_era5_land.py).
  point_bbox_epsilon_deg: 0.06
  # Pedir la radiación punto por punto significa una solicitud HTTP por
  # cada (punto ERA5, mes) — para la grilla real (miles de puntos) esto
  # tarda decenas de horas, porque cada solicitud pasa por cola en el
  # servidor de CDS (~20-35s observados). El dataset soporta pedir un
  # bounding box y devuelve TODOS los puntos de grilla adentro en una
  # sola respuesta, así que los puntos ERA5 únicos que necesita la
  # grilla se agrupan en tiles de este tamaño (en grados) y se piden de
  # a un tile por solicitud.
  #
  # OJO: el límite geográfico documentado por CDS para el modo área es
  # 1.0° de lado (`maximum_extent`), PERO además hay un límite de "costo"
  # no documentado (probablemente ~puntos × horas del rango de fechas)
  # que es más restrictivo. Calibrado empíricamente contra la API real
  # pidiendo un mes completo (744 horas):
  #   - tile 0.2° (~9 puntos, 6.696 punto-horas)  -> OK
  #   - tile 0.3° (~16 puntos, 11.904 punto-horas) -> OK
  #   - tile 0.4° (~25 puntos, 18.600 punto-horas) -> falla: "cost limits
  #     exceeded, Your request is too large, please reduce your selection"
  #   - tile 0.9° (~100 puntos, 74.400 punto-horas) -> falla, mismo error
  # 0.3° da un buen equilibrio (711 solicitudes en vez de 5424 para la
  # grilla real de Santa Fe a 5km) con margen respecto al límite real
  # (11.904 de 18.600 que ya falló). Si se sube este valor, validar antes
  # con una sola solicitud de prueba — un valor demasiado alto no falla
  # en silencio (CDS devuelve 403 con el mensaje de arriba), pero conviene
  # no gastar tiempo de cola contra el límite real sin necesidad.
  area_tile_size_deg: 0.3

infrastructure:
  urban_areas:
    # Localidades BAHRA (puntos), DataStore de datos.gob.ar.
    # https://datos.gob.ar/dataset/localidades-bahra
    resource_id: "c1fc1f5b-dfe3-5231-9f3b-f7c703b906c7"
  power_lines:
    # Redes de distribución eléctrica del Consejo Federal, DataStore de datos.gob.ar.
    # Contiene geometrías de línea con un único atributo "tension" (voltaje) —
    # SIN entidades de transformador/subestación (confirmado al inspeccionar el schema).
    resource_id: "3d5eda86-6822-5c39-b366-f89360b0363a"
  transformers:
    # Transporte Eléctrico AT - Estaciones Transformadoras.
    # Secretaría de Energía de la Nación, datos.gob.ar (descarga directa de
    # CSV, no respaldada por DataStore). Es necesaria porque el dataset de
    # líneas eléctricas de arriba no tiene capa de subestaciones. Si esta
    # fuente alguna vez deja de estar disponible, el pipeline debe detenerse
    # e informar la capa faltante — nunca inventar ubicaciones de transformadores.
    # https://datos.gob.ar/dataset/transporte-electrico-at-estaciones-transformadoras
    source_url: "http://datos.energia.gob.ar/dataset/5ae5fbf9-5ab3-407b-a047-625bf27835aa/resource/cedb62c4-4a4c-4124-bdc9-48f611a59862/download/transporte-elctrico-at-estaciones-transformadoras.csv"
    native_crs: "EPSG:4326"

fitness:
  # Pesos iniciales del MVP — valores provisorios para calibrar a futuro, no
  # una ponderación científicamente validada. Deben sumar 1.0 (+/- 1e-6).
  # La proximidad a transformadores pesa más que la proximidad simple a
  # líneas, según lo pedido en el proyecto.
  weight_solar: 0.50
  weight_grid_distance: 0.20
  weight_transformer_distance: 0.30

genetic_algorithm:
  population_size: 50
  generations: 100
  crossover_probability: 0.75
  mutation_probability: 0.05
  elitism: 2
  tournament_size: 3
  random_seed: 42

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  era5_cache: "data/cache/era5_land_cache"
  database: "data/processed/parque_solar.sqlite"
  results: "results"
  logs: "logs"
