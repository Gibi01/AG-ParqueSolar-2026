# Configuración para el MVP de ubicación de parques solares.
#
# Región fija de esta versión: Santa Fe. No cambiar `region`; la estructura
# solo admite el nombre Santa Fe y el código 82.

region:
  name: "Santa Fe"
  # Fuente oficial del límite administrativo: dataset "Unidades Territoriales"
  # del Instituto Geográfico Nacional (IGN), publicado en datos.gob.ar.
  # https://datos.gob.ar/dataset/unidades-territoriales
  admin_source:
    provider: "IGN"
    shapefile_zip_url: "http://www.ign.gob.ar/descargas/geodatos/SHAPES/ign_provincia.zip"
    shapefile_member: "Provincia/ign_provincia.shp"
    name_field: "NAM"      # nombre corto de la provincia, ej. "Santa Fe"
    code_field: "IN1"      # código de provincia INDEC/GeoRef, ej. "82" para Santa Fe
    code_value: "82"
    native_crs: "EPSG:4326"  # CRS del propio shapefile del IGN (confirmado desde su .prj)

grid:
  # Tamaño de celda de la grilla de análisis. Es una unidad de discretización
  # espacial para el problema de optimización — NO la resolución de ninguna
  # fuente de datos en particular.
  resolution_km: 0.5

park:
  # NREL: 7.9 acres/MWac de área total, aproximadamente 31.3 MWac/km².
  pv_power_density_mw_per_km2: 31.3
  # Restricción EXPERIMENTAL, no capacidad real de ninguna estación.
  max_connection_capacity_mw: 80
urban_exclusion:
  # Margen desde el perímetro de las envolventes INDEC, en un CRS métrico.
  # 0 es la línea de base; 0.1/0.25/0.5 km son escenarios aún por calibrar.
  buffer_km: 0.0
  # Política conservadora: excluir huecos encerrados, incluso sin edificios.
  # No genera una envolvente convexa ni une componentes rurales separados.
  fill_holes: true

climate:
  # Dataset del Copernicus Climate Data Store. DEBE seguir siendo el dataset
  # Time-Series / ARCO según los requisitos del proyecto — no sustituir por
  # ERA5 simple, ERA5-Land mensual, ni el archivo horario bulk de ERA5-Land.
  dataset: "reanalysis-era5-land-timeseries"
  variable: "surface_solar_radiation_downwards"
  start_year: 2024
  end_year: latest  # último mes representativo completo con un mes de margen de publicación
  months: [1, 4, 7, 10]   # enero (verano), abril (otoño), julio (invierno), octubre (primavera)
  # Fuente climática única: almacén ARCO Zarr de ERA5-Land.

infrastructure:
  urban_areas:
    provider: "INDEC"
    wfs_url: "https://geonode.indec.gob.ar/geoserver/geonode/wfs"
    layer_name: "geonode:localidades_censales"
    reference_year: 2022
    page_size: 500
  power_lines:
    # Redes de distribución eléctrica del Consejo Federal, DataStore de datos.gob.ar.
    # Contiene geometrías de línea con un único atributo "tension" (voltaje) —
    # SIN entidades de transformador/subestación (confirmado al inspeccionar el schema).
    resource_id: "3d5eda86-6822-5c39-b366-f89360b0363a"
  transformers:
    # Transporte Eléctrico AT - Estaciones Transformadoras.
    # Secretaría de Energía de la Nación, datos.gob.ar (descarga directa de
    # CSV, no respaldada por DataStore). Es necesaria porque el dataset de
    # líneas eléctricas de arriba no tiene capa de subestaciones. Si esta
    # fuente alguna vez deja de estar disponible, el pipeline debe detenerse
    # e informar la capa faltante — nunca inventar ubicaciones de transformadores.
    # https://datos.gob.ar/dataset/transporte-electrico-at-estaciones-transformadoras
    source_url: "http://datos.energia.gob.ar/dataset/5ae5fbf9-5ab3-407b-a047-625bf27835aa/resource/cedb62c4-4a4c-4124-bdc9-48f611a59862/download/transporte-elctrico-at-estaciones-transformadoras.csv"
    native_crs: "EPSG:4326"

fitness:
  # Pesos iniciales del MVP — valores provisorios para calibrar a futuro, no
  # una ponderación científicamente validada. Deben sumar 1.0 (+/- 1e-6).
  # Peso 0 desactiva el criterio: no se descarga ni se calcula su fuente.
  # La exclusión urbana sigue activa, separada del fitness.
  weight_solar: 0.35
  weight_grid_distance: 0.10
  weight_transformer_distance: 0.35
  weight_installed_power: 0.10
  # Preferencia experimental por menor perímetro a igual superficie: 4πA/P².
  weight_compactness: 0.10

genetic_algorithm:
  population_size: 50
  generations: 200
  crossover_probability: 0.75
  mutation_probability: 0.20
  elitism: 2
  tournament_size: 3
  random_seed: 42
  territory_size_km: 50
  duplicate_attempts: 8
  mutation_attempts: 4
  territorial_separation_km: 0  # Sin superposición; sin distancia adicional por defecto.
  archive_per_territory: 10  # Reserva interna, no tamaño del ranking final (top 5).

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  arco_cache: "data/cache/arco_blocks"
  database: "data/processed/parque_solar_spatial.sqlite"
  results: "results/spatial"
  logs: "logs"
